<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>整理截图 · 拾句</title><link rel="stylesheet" href="ui.css"></head>
<body class="organizer"><main class="organizer-page"><a class="brand" href="options.html"><img class="mark" src="icons/icon.svg" alt="">拾句</a>
<div class="organizer-heading"><span class="eyebrow">AFTER THE EPISODE</span><h1>整理已收藏截图</h1><p>Codex 读取截图中的英文表达，先生成命名建议。检查后再批量改名。</p></div>
<section><h2>选择截图文件夹</h2><div class="organizer-controls"><button id="folder" type="button" class="secondary folder-picker" title="选择要整理的文件夹"><span id="folder-path">正在读取当前保存文件夹…</span><span aria-hidden="true">⌄</span></button><button id="start" type="button" class="primary" disabled>生成命名建议</button></div><p id="folder-count" class="hint"></p><button id="reset-folder" type="button" class="text-button" hidden>使用当前截图保存文件夹</button><p id="progress" class="folder-status" role="status" aria-live="polite"></p></section>
<section id="review" hidden><div class="organizer-review-heading"><h2>检查建议</h2><span id="review-count"></span></div><p class="hint">文件名使用字幕中的 1 至 6 个连续英文词；值得记住的短句可完整保留，长句需提炼，不使用中文。看不清的字幕默认不勾选；未勾选的图片保留原名。</p><div id="suggestions" class="suggestions"></div><div class="organizer-actions"><button id="apply" class="primary" type="button">确认并改名</button><button id="undo" class="secondary" type="button" hidden>撤销本次改名</button></div></section>
</main><dialog id="image-preview" class="image-preview" aria-labelledby="preview-title"><div class="preview-bar"><h2 id="preview-title">核对截图</h2><button id="close-preview" type="button" class="secondary">关闭 ×</button></div><div class="preview-scroll"><img id="preview-image" alt=""><div class="preview-meta"><p id="preview-filename"></p><p id="preview-subtitle"></p><p id="preview-suggested"></p></div></div></dialog><script type="module" src="organize.js"></script></body></html>
